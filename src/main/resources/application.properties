# Externalized settings. CONVENTIONS.md: nothing outside com.pos.config reads
# these -- inject AppProperties instead of sprinkling @Value across services.
#
# Every value takes an environment-variable override so the SAME war runs locally
# and deployed. The defaults below are the local-dev ones; a deployed environment
# sets the variables instead.

# --- Database -----------------------------------------------------------------
# Three URL parameters, none of them decoration:
#
#   createDatabaseIfNotExist  the driver creates pos_dev on first connect, so a
#                             fresh clone needs no manual CREATE DATABASE. It is
#                             on the LOCAL default deliberately and must NOT be
#                             set deployed: there a typo'd database name would
#                             silently create an empty schema and boot against it
#                             instead of failing loudly, and it forces the app
#                             user to hold CREATE, against least privilege.
#                             The database is created with the server defaults,
#                             which on MySQL 8+ are utf8mb4 / utf8mb4_0900_ai_ci.
#   allowPublicKeyRetrieval   MySQL 8+ defaults to the caching_sha2_password
#                             plugin, which refuses to hand over its public key
#                             over an unencrypted connection without this. A
#                             deployed connection uses SSL and doesn't need it.
#   serverTimezone=UTC        timestamps are stored and compared in UTC.
pos.db.url=${POS_DB_URL:jdbc:mysql://localhost:3306/pos_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#
# Credentials are NOT committed. This file is tracked, so the password default is
# empty on purpose -- supply it either as POS_DB_PASSWORD, or in
# application-local.properties, which .gitignore already reserves for exactly this
# and which PersistenceConfig loads last so it wins. An empty password fails at
# connect with an authentication error, which is the right kind of loud.
pos.db.username=${POS_DB_USERNAME:pos_admin}
pos.db.password=${POS_DB_PASSWORD:}

# Set explicitly, never inherited. Free-tier MySQL caps connections at 5-20 and
# Hikari's default of 10 will exhaust it -- backend-plan.md section 3 calls this
# the most common way free-tier apps fall over.
pos.db.pool.maxSize=${POS_DB_POOL_MAX_SIZE:5}

# --- Hibernate ----------------------------------------------------------------
# `update` for local dev, `create-drop` for tests (application-test.properties),
# `create` then `validate` deployed. There is no migration tool -- see
# prompts/database/README.md for why, and what that costs.
pos.hibernate.ddlAuto=${POS_HIBERNATE_DDL_AUTO:update}
pos.hibernate.showSql=${POS_HIBERNATE_SHOW_SQL:false}

# --- Auth (C3) ----------------------------------------------------------------
# The JWT signing key. CONVENTIONS.md: never commit a secret -- so unlike every
# other setting here, this default is NOT a working value. It is a placeholder
# that JwtTokenService rejects at startup, because a usable default is exactly how
# a signing key leaks: it works everywhere, so nobody ever sets the real one, and
# anyone with the source can mint a token for any tenant.
#
# Locally, put a real one in application-local.properties (gitignored). Deployed,
# set POS_JWT_SECRET. It must be at least 32 bytes -- HS256 keys shorter than the
# hash output are rejected by the JWA spec and by jjwt.
pos.jwt.secret=${POS_JWT_SECRET:CHANGE_ME}

# 12 hours: long enough that a full retail shift is one login, so a cashier is
# never logged out mid-transaction. There is no refresh token (backend-plan.md
# section 11 keeps that open), so this is also the hard session length.
pos.jwt.ttlMinutes=${POS_JWT_TTL_MINUTES:720}

# Peer-review Phase 0: LoginAttemptGuard locks a (tenantCode, username) pair out
# for pos.login.lockout.minutes once it accumulates this many consecutive wrong
# passwords -- see that class's Javadoc for the trade-off it accepts. These are
# the real, enforced values; application-test.properties raises maxFailures well
# above them because the IT suite deliberately sends wrong passwords against the
# same handful of shared seed accounts (mg-road/admin, etc.) across many classes,
# and must not lock one class's fixtures out from another's. LoginAttemptGuardTest
# is what actually proves this threshold, not the test profile.
pos.login.lockout.maxFailures=${POS_LOGIN_LOCKOUT_MAX_FAILURES:5}
pos.login.lockout.minutes=${POS_LOGIN_LOCKOUT_MINUTES:15}

# Peer-review Phase 0: a coarse per-user request budget across ALL authenticated
# /api/** traffic, not just login -- checked in JwtAuthenticationFilter right
# after a token resolves to a session. pos.db.pool.maxSize (above) is
# deliberately small for the e2-micro/free-tier connection cap, so a handful of
# concurrent clients hammering any list/search endpoint -- a runaway UI bug, a
# compromised token, a scripted client -- can exhaust it and starve every OTHER
# tenant sharing the VM, not just the caller. 120 requests/60s (2/s average) is
# sized to absorb a normal page's handful of parallel calls plus a debounced
# search (250ms, frontend CONVENTIONS.md) comfortably, while still bounding a
# runaway client well short of the pool. application-test.properties raises
# this for the same shared-fixture reason pos.login.lockout.maxFailures does --
# ApiRateLimiterTest proves the real threshold, not the test profile.
pos.api.rateLimit.maxRequests=${POS_API_RATE_LIMIT_MAX_REQUESTS:120}
pos.api.rateLimit.windowSeconds=${POS_API_RATE_LIMIT_WINDOW_SECONDS:60}

# --- Dev seed data ------------------------------------------------------------
# Loads the frontend's demo tenants and users (README) so the same logins work
# against real persistence. Defaults to FALSE, unlike the local-flavoured defaults
# above: this one seeds admin accounts with published passwords, so an environment
# that forgets to set it must end up with no accounts rather than with those.
#
# You do not need to pass it locally. The POM sets POS_SEED_DEV=true on the
# jetty:run goal, so `mvn jetty:run` seeds and the deployed WAR cannot -- nothing
# but local development runs that goal. Overriding the default here would put the
# decision back in the artifact, where forgetting it becomes possible.
pos.seed.dev=${POS_SEED_DEV:false}

# --- Mail (C9, tenant-registration-plan.md) ------------------------------------
# Self-registration's verification email. SMTP relay through a Gmail/Workspace
# account (plan section 2 -- GCP has no first-party transactional-email product),
# an app password standing in for a real credential the same way db_app_password
# and jwt_secret already do.
#
# Defaults to FALSE, unlike most settings above: a working default here would mean
# `mvn test` and `mvn jetty:run` try to open a real SMTP connection on every run.
# MailConfig falls back to a log-only EmailSender whenever this is off, so a
# developer never needs a Gmail account to exercise registration locally. Only a
# deployed environment sets POS_MAIL_ENABLED=true, once iac has actually
# provisioned the secrets below (plan section 6 -- deliberately not done until the
# backend code that reads them exists).
pos.mail.enabled=${POS_MAIL_ENABLED:false}

# smtp.gmail.com:587 (STARTTLS submission, not port 25/465) is the pair the plan's
# Decision #2 settled on. Meaningless while pos.mail.enabled is false, so blank
# username/app-password defaults are safe here in a way they would not be for
# pos.db.password.
pos.mail.host=${POS_MAIL_HOST:smtp.gmail.com}
pos.mail.port=${POS_MAIL_PORT:587}
pos.mail.username=${POS_MAIL_USERNAME:}
pos.mail.appPassword=${POS_MAIL_APP_PASSWORD:}
pos.mail.fromAddress=${POS_MAIL_FROM_ADDRESS:}

# --- App-level (C9) -------------------------------------------------------------
# The externally-visible frontend URL, needed to build the verification link the
# email embeds (e.g. {frontendBaseUrl}/verify?token=...). Didn't exist as a concept
# before this feature -- same-origin Nginx proxying meant the backend never
# previously had to know where the frontend lives. Matches SecurityConfig's
# FRONTEND_DEV_ORIGIN for local dev; a deployed environment sets
# POS_FRONTEND_BASE_URL to the real externally-visible URL (iac, deliberately not
# provisioned yet -- tenant-registration-plan.md section 6: no point wiring a
# secret/variable for code that didn't exist until now).
pos.app.frontendBaseUrl=${POS_FRONTEND_BASE_URL:http://localhost:5173}

# --- reCAPTCHA (peer-review Phase 0) -------------------------------------------
# Server-side verification of the frontend's v2 checkbox widget on
# POST /api/tenants/register and /resend-verification -- the backstop for a
# scripted attacker who knows to leave the honeypot (com.pos.util.Honeypot) blank.
# Login is deliberately NOT covered (peer-review decision): it already has
# LoginRateLimiter + LoginAttemptGuard, and CAPTCHA friction there would hit every
# cashier's shift-start login for little added benefit.
#
# Defaults to FALSE, the same reasoning as pos.mail.enabled: a working default
# here would mean mvn test and an out-of-the-box mvn jetty:run need a real Google
# site registration before either endpoint works at all. RecaptchaConfig falls
# back to a verifier that always passes whenever this is off, so a developer
# never needs a reCAPTCHA account to exercise registration locally. Only a
# deployed environment sets POS_RECAPTCHA_ENABLED=true, once iac has actually
# provisioned the secret below.
pos.recaptcha.enabled=${POS_RECAPTCHA_ENABLED:false}

# The reCAPTCHA secret key (console.cloud.google.com/security/recaptcha or
# google.com/recaptcha/admin) -- same treatment as pos.jwt.secret/pos.db.password:
# externalized, never committed, no usable default. Locally, put a real one in
# application-local.properties (gitignored) to exercise the real Google round
# trip; deployed, set POS_RECAPTCHA_SECRET. Meaningless while
# pos.recaptcha.enabled is false, so a blank default is safe here in a way it
# would not be for pos.jwt.secret.
pos.recaptcha.secret=${POS_RECAPTCHA_SECRET:}

# --- Resource-creation guardrails (peer-review Phase 0) ------------------------
# Durable per-resource ceilings, deliberately NOT the LoginAttemptGuard/
# ApiRateLimiter in-memory time-windowed shape (those reset on restart; these are
# permanent counts backed by a DAO query before insert). Each throws the existing
# ValidationException.field(...) (400), no new exception type. Flat, global values
# for now -- the seam a future tenant-tier/plan concept would replace, not tier
# logic itself.
#
# Line items per order (cart size) -- OrderService.rebuildLines(), the single
# choke point both create() and update() funnel through. 100 is comfortably above
# any real cart (checkout's own UI has never been used past a few dozen lines)
# while still bounding a scripted client from building an unbounded PosOrder in
# one request.
pos.order.maxLineItems=${POS_ORDER_MAX_LINE_ITEMS:100}

# Users (ADMIN+CASHIER combined) per tenant -- UserService.create(), checked
# against AppUserDao.countActiveByOwnTenant before insert. 20 covers a real
# store's roster (a handful of admins, cashiers per shift) with headroom, while
# bounding how many accounts a compromised or malicious admin session can mint
# in one tenant.
#
# Peer-review Phase 1: ACTIVE users only, as of this change -- deactivating a
# user (someone who left) now frees a slot again, matching what soft-delete
# means everywhere else in this codebase. countActiveByOwnTenant is the primary
# check; countByOwnTenant (unchanged, any status, ever) is the second tier --
# see pos.tenant.maxUsersLifetime below.
pos.tenant.maxUsers=${POS_TENANT_MAX_USERS:20}

# Products per tenant -- ProductService.create(), checked against
# ProductDao.count(null, null, false) (already tenant-filtered by the Hibernate
# @Filter) before insert. 2000 is well above any real single-store catalogue
# while bounding how large a scripted client can grow one tenant's table.
#
# Peer-review Phase 1: ACTIVE products only, as of this change, for the same
# reason as pos.tenant.maxUsers above -- retiring a discontinued SKU frees a
# slot again. count(null, null, true) (any status, ever) is the second tier --
# see pos.tenant.maxProductsLifetime below.
pos.tenant.maxProducts=${POS_TENANT_MAX_PRODUCTS:2000}

# Variants per product -- VariantService.create(), checked against
# VariantDao.countActiveByProduct before insert. 50 is well above any real
# product's size/color/pack-size spread while bounding how many rows one
# product can be used to mint.
#
# Peer-review Phase 1: ACTIVE variants only, as of this change, same reasoning
# as the two above. countByProduct (unchanged, any status, ever) is the second
# tier -- see pos.product.maxVariantsLifetime below.
pos.product.maxVariants=${POS_PRODUCT_MAX_VARIANTS:50}

# Tenants per admin email, lifetime, any status -- TenantRegistrationWriter.register(),
# checked against AppUserDao.countByEmail before insert. Subsumes the original
# "pending/unverified registrations per email" concern from the same review pass:
# a single lifetime cap on how many stores one email can register is simpler than a
# separate racy concurrent-pending check, and catches the identical abuse. 5 is well
# above a legitimate multi-store owner's onboarding pace while bounding how many free
# tenants one address can mint via public self-registration.
pos.tenant.maxPerEmail=${POS_TENANT_MAX_PER_EMAIL:5}

# --- Two-tier guardrail backstops (peer-review Phase 1) ------------------------
# The second tier for the three guardrails above: the SAME count, any status,
# ever -- never reclaimed by deactivating anything, deliberately, the pure abuse
# backstop that was the entire reason a durable ceiling was chosen over a
# reclaimable one in the first place (a create/deactivate loop must still hit a
# wall eventually). 5x each real ceiling -- comfortably beyond any organic churn
# a real store accumulates over years, while still bounding how large a scripted
# client can grow one tenant's tables.
#
# No lifetime backstop for pos.tenant.maxPerEmail: the sharp form of that
# problem (abandoned PENDING_VERIFICATION registrations counting forever) is
# already fixed by the cleanup job below, which deletes those rows outright
# rather than needing a second tier to work around them. See requirements.md
# section 12.
pos.tenant.maxUsersLifetime=${POS_TENANT_MAX_USERS_LIFETIME:100}
pos.tenant.maxProductsLifetime=${POS_TENANT_MAX_PRODUCTS_LIFETIME:10000}
pos.product.maxVariantsLifetime=${POS_PRODUCT_MAX_VARIANTS_LIFETIME:250}

# --- Abandoned self-registration cleanup (peer-review Phase 1) -----------------
# The first scheduled job in this codebase (com.pos.job.AbandonedTenantCleanupJob,
# AbandonedTenantCleanupService). Deletes any tenant still PENDING_VERIFICATION once
# its verificationExpiresAt has passed -- no new time constant, that's the existing
# 24h token TTL (TenantRegistrationWriter.TOKEN_TTL_HOURS) -- plus its one admin
# app_user row, which otherwise permanently squats that tenant's `code` and one of
# its admin email's lifetime registration slots (pos.tenant.maxPerEmail above).
#
# Off in tests (application-test.properties): the cleanup logic is proven directly
# against AbandonedTenantCleanupService.cleanUp(), not by waiting for the scheduler
# to fire during a test-context boot.
pos.job.abandonedTenant.enabled=${POS_JOB_ABANDONED_TENANT_ENABLED:true}

# How often the job runs, not how long a registration is given -- that's still the
# 24h token TTL above. 6 hours bounds how long an abandoned code/email slot stays
# squatted past its own expiry to a few hours, at negligible cost -- a full scan of
# the tenant table (no dedicated index; one row per store, never a large table),
# almost always answering zero rows.
pos.job.abandonedTenant.intervalMinutes=${POS_JOB_ABANDONED_TENANT_INTERVAL_MINUTES:360}
