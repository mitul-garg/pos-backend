# Externalized settings. CONVENTIONS.md: nothing outside com.pos.config reads
# these -- inject AppProperties instead of sprinkling @Value across services.
#
# Every value takes an environment-variable override so the SAME war runs locally
# and deployed. The defaults below are the local-dev ones; a deployed environment
# sets the variables instead.

# --- Database -----------------------------------------------------------------
# Three URL parameters, none of them decoration:
#
#   createDatabaseIfNotExist  the driver creates pos_dev on first connect, so a
#                             fresh clone needs no manual CREATE DATABASE. It is
#                             on the LOCAL default deliberately and must NOT be
#                             set deployed: there a typo'd database name would
#                             silently create an empty schema and boot against it
#                             instead of failing loudly, and it forces the app
#                             user to hold CREATE, against least privilege.
#                             The database is created with the server defaults,
#                             which on MySQL 8+ are utf8mb4 / utf8mb4_0900_ai_ci.
#   allowPublicKeyRetrieval   MySQL 8+ defaults to the caching_sha2_password
#                             plugin, which refuses to hand over its public key
#                             over an unencrypted connection without this. A
#                             deployed connection uses SSL and doesn't need it.
#   serverTimezone=UTC        timestamps are stored and compared in UTC.
pos.db.url=${POS_DB_URL:jdbc:mysql://localhost:3306/pos_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#
# Credentials are NOT committed. This file is tracked, so the password default is
# empty on purpose -- supply it either as POS_DB_PASSWORD, or in
# application-local.properties, which .gitignore already reserves for exactly this
# and which PersistenceConfig loads last so it wins. An empty password fails at
# connect with an authentication error, which is the right kind of loud.
pos.db.username=${POS_DB_USERNAME:pos_admin}
pos.db.password=${POS_DB_PASSWORD:}

# Set explicitly, never inherited. Free-tier MySQL caps connections at 5-20 and
# Hikari's default of 10 will exhaust it -- backend-plan.md section 3 calls this
# the most common way free-tier apps fall over.
pos.db.pool.maxSize=${POS_DB_POOL_MAX_SIZE:5}

# --- Hibernate ----------------------------------------------------------------
# `update` for local dev, `create-drop` for tests (application-test.properties),
# `create` then `validate` deployed. There is no migration tool -- see
# prompts/database/README.md for why, and what that costs.
pos.hibernate.ddlAuto=${POS_HIBERNATE_DDL_AUTO:update}
pos.hibernate.showSql=${POS_HIBERNATE_SHOW_SQL:false}
