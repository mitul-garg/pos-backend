# Test settings. Loaded by @TestPropertySource on the integration tests, which
# outranks the @PropertySource in PersistenceConfig, so these win without the
# main application.properties needing to know tests exist.
#
# Points at pos_test, NEVER pos_dev: create-drop below drops every table on each
# run, and aiming that at the dev database would wipe the seed data (and any
# in-progress manual test) on every `mvn test`.
#
# createDatabaseIfNotExist means the suite runs on a fresh clone with no manual
# database setup at all.
#
# Note what is NOT here: username and password. This file is tracked, and the test
# database uses the same local credentials as the dev one, so they resolve through
# the normal chain (application.properties, then the gitignored
# application-local.properties). Only the four settings that genuinely differ from
# dev are overridden below.
pos.db.url=${POS_TEST_DB_URL:jdbc:mysql://localhost:3306/pos_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# Small on purpose. The suite is not a load test, and a tight pool surfaces a
# connection leak as a hang in CI rather than as nothing at all.
pos.db.pool.maxSize=2

# The point of create-drop here is that the schema ALWAYS matches the entities
# exactly and cannot drift -- which is what makes SchemaConstraintsIT's findings
# statements about the entities rather than about leftover local state.
pos.hibernate.ddlAuto=create-drop
pos.hibernate.showSql=false

# A fixed, throwaway signing key. Committed on purpose and harmless: it signs
# tokens for a database that is dropped at the end of every run. The point of
# setting it here is that the suite must not depend on a developer's
# application-local.properties -- and must not silently pass because of one
# either. It is 32+ bytes because HS256 rejects anything shorter.
pos.jwt.secret=test-only-signing-key-not-a-secret-0123456789

# Off by default so an integration test's own fixtures are the only rows in the
# database. DevSeederIT turns it on for itself.
pos.seed.dev=false

# Raised far above the production default (5, see application.properties) --
# LoginAttemptGuard is a Spring-managed singleton shared by every IT class with
# an identical @ContextConfiguration, and dozens of them deliberately send a
# wrong password against the same handful of shared seed accounts (mg-road/admin,
# etc.) to test the generic-401 path. At the real threshold that cross-test
# churn locks those accounts out of every OTHER test's login-as-fixture setup.
# LoginAttemptGuardTest exercises the real threshold directly, with no Spring
# context at all, so this override doesn't weaken what's actually proven.
pos.login.lockout.maxFailures=100000

# Same reasoning as pos.login.lockout.maxFailures above, for ApiRateLimiter: it's
# also a Spring-managed singleton shared by every IT class with an identical
# @ContextConfiguration, and the same handful of fixture accounts (mg-road/admin,
# etc.) rack up API calls across the WHOLE mvn test run, not just one test.
# ApiRateLimiterTest exercises the real 120/60s threshold directly, with no
# Spring context at all.
pos.api.rateLimit.maxRequests=100000

# Explicitly off, not merely inheriting application.properties' false default --
# a developer's application-local.properties CAN set pos.recaptcha.enabled=true
# with a real secret for manual testing (the same file already carries
# pos.jwt.secret/pos.db.password), and that file is loaded in test contexts too
# (see the username/password comment above). Without this override, mvn test
# would silently start making real network calls to Google -- or rejecting
# every fixture registration outright, since none of them carry a real solved
# token -- depending entirely on whichever developer's machine it runs on. Found
# by mvn test actually failing that way, not by reasoning about it in advance.
pos.recaptcha.enabled=false

# Off, not merely inheriting -- see application.properties for why: the cleanup
# logic is proven directly against AbandonedTenantCleanupService.cleanUp() (a
# plain @Transactional call, IT-tested at the real 24h TTL it reads), not by
# waiting for AbandonedTenantCleanupJob's scheduler to fire during a test-context
# boot. Every IT class shares one cached Spring context (CONVENTIONS.md), so
# leaving this on would run a real query -- and, if a suite ever leaves a stale
# expired PENDING_VERIFICATION fixture lying around, a real delete -- against
# fixtures another test file still expects to find.
pos.job.abandonedTenant.enabled=false

# Same reasoning as pos.recaptcha.enabled above: a developer's
# application-local.properties CAN set pos.images.enabled=true with a real
# signer key path for manual testing against the live bucket (this session
# did exactly that). Without this override, mvn test would depend on
# whichever developer's machine it runs on instead of always exercising
# NoopImageSigner.
pos.images.enabled=false
